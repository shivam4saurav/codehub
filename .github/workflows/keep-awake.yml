# Keeps the Render free instance awake by calling the health endpoint.
# Render sleeps a free web service after 15 minutes without traffic; a sleeping
# instance also pauses the cron jobs that send contest reminder emails.
#
# GitHub runs scheduled workflows on a best-effort basis, so a tick can arrive
# late during busy periods. For stricter uptime, also add an external monitor
# (for example UptimeRobot) pointing at the same URL.
name: Keep API awake

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes, the shortest interval GitHub allows
  workflow_dispatch: # allows a manual run from the Actions tab

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          HEALTH_URL: https://codehub-api-bsmg.onrender.com/api/health
        run: |
          # A cold start can take about a minute, so allow retries with a long timeout.
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$HEALTH_URL" || echo 000)
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "::warning::API did not answer 200 after 3 attempts"
          exit 1
